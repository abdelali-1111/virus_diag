name: CI - virus_diag

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx flake8

      - name: Lint (flake8)
        run: flake8 . --select=E9,F63,F7,F82 --show-source --exclude=.git,__pycache__

      - name: Tests unitaires
        run: pytest -v

      - name: Verifier entrainement et evaluation
        run: python main.py cli